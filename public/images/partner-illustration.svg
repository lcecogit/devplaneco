<svg width="600" height="480" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="partnerTitle">
  <title id="partnerTitle">Illustration of a driver standing beside their van holding a delivery box, with a phone showing accepted jobs</title>
  <defs>
    <linearGradient id="partnerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C0F5C"/>
      <stop offset="100%" stop-color="#291686"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="480" rx="28" fill="url(#partnerBg)"/>
  <ellipse cx="300" cy="410" rx="220" ry="28" fill="#000000" opacity="0.18"/>

  <!-- van -->
  <g transform="translate(300,190)">
    <rect x="0" y="10" width="220" height="110" rx="14" fill="#FFFFFF" opacity="0.08"/>
    <rect x="0" y="10" width="220" height="110" rx="14" fill="none" stroke="#8069EE" stroke-width="3"/>
    <rect x="16" y="26" width="80" height="60" rx="8" fill="#5B3DF6"/>
    <rect x="30" y="40" width="30" height="30" rx="4" fill="#C7BAFB"/>
    <circle cx="55" cy="128" r="20" fill="#0F1024"/>
    <circle cx="55" cy="128" r="8" fill="#C7BAFB"/>
    <circle cx="185" cy="128" r="20" fill="#0F1024"/>
    <circle cx="185" cy="128" r="8" fill="#C7BAFB"/>
  </g>

  <!-- driver figure -->
  <g transform="translate(150,150)">
    <circle cx="40" cy="30" r="24" fill="#FFD9C7"/>
    <path d="M16 28c2-16 44-16 46 0" fill="#291686"/>
    <rect x="10" y="56" width="60" height="90" rx="18" fill="#FF6B4A"/>
    <rect x="20" y="146" width="18" height="60" rx="8" fill="#0F1024"/>
    <rect x="46" y="146" width="18" height="60" rx="8" fill="#0F1024"/>
    <!-- box in hands -->
    <rect x="52" y="70" width="46" height="40" rx="4" fill="#FFFFFF"/>
    <path d="M52 88h46M75 70v40" stroke="#5B3DF6" stroke-width="3"/>
  </g>

  <!-- phone with job list -->
  <g transform="translate(420,60)">
    <rect x="0" y="0" width="110" height="180" rx="16" fill="#FFFFFF"/>
    <rect x="10" y="16" width="90" height="150" rx="6" fill="#F2EFFE"/>
    <rect x="20" y="30" width="70" height="10" rx="3" fill="#5B3DF6"/>
    <rect x="20" y="52" width="70" height="26" rx="6" fill="#FFFFFF" stroke="#C7BAFB" stroke-width="2"/>
    <rect x="20" y="86" width="70" height="26" rx="6" fill="#FFFFFF" stroke="#C7BAFB" stroke-width="2"/>
    <rect x="20" y="120" width="70" height="26" rx="6" fill="#12BD79"/>
    <path d="M30 133l6 6 12-13" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- coins / earnings -->
  <g transform="translate(90,60)">
    <circle cx="20" cy="40" r="20" fill="#FF6B4A"/>
    <circle cx="46" cy="20" r="20" fill="#FFA688"/>
    <text x="12" y="46" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">£</text>
    <text x="38" y="26" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">£</text>
  </g>
</svg>

name: CRM CI

# Runs on every push that touches the CRM. Needs no secrets, so it works the
# moment this file lands.
on:
  push:
    paths: ['crm/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['crm/**', '.github/workflows/ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: crm

jobs:
  app:
    name: Typecheck, tests, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # Built without Supabase config on purpose: this is the sample-mode
      # build, and it proves the app still compiles and renders with no
      # database attached.
      - run: npm run build

  database:
    name: SQL parts on a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply each part alone, then all in order, then again
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          pq() { psql -v ON_ERROR_STOP=1 "$@"; }
          fresh() {
            pq -q -d postgres -c "drop database if exists $1;" -c "create database $1;"
            pq -q -d "$1" -f tests/db/00_supabase_shim.sql
          }

          echo "--- each part alone on an empty database"
          for f in supabase/parts/0[1-5]_*.sql; do
            fresh solo
            if out=$(pq -q -d solo -f "$f" 2>&1); then
              echo "  $(basename "$f"): succeeded standalone"
            else
              if grep -q '3F000' <<<"$out"; then
                echo "  $(basename "$f"): FAILED with 3F000"; echo "$out"; exit 1
              fi
              echo "  $(basename "$f"): refused -> $(grep -m1 -o 'ERROR:.*' <<<"$out")"
            fi
          done

          echo "--- all parts in order, twice"
          fresh crm
          for pass in 1 2; do
            for f in supabase/parts/0[1-5]_*.sql; do
              printf '  pass %s %s ... ' "$pass" "$(basename "$f")"
              pq -q -d crm -f "$f" >/dev/null && echo ok
            done
          done

          echo "--- shape"
          pq -tA -d crm \
            -c "select 'tables ' || count(*) from pg_tables where schemaname='public'" \
            -c "select 'policies ' || count(*) from pg_policies where schemaname='public'" \
            -c "select 'rls off ' || count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity" \
            -c "select 'brands ' || count(*) from brands"

          echo "--- assertions"
          test "$(pq -tA -d crm -c "select count(*) from pg_tables where schemaname='public'")" = "42"
          test "$(pq -tA -d crm -c "select count(*) from pg_policies where schemaname='public'")" = "68"
          test "$(pq -tA -d crm -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and not c.relrowsecurity")" = "0"
          test "$(pq -tA -d crm -c "select count(*) from brands")" = "6"
          echo "database verification passed"

      - name: Run the SQL test suite
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in tests/db/[1-9]*.sql; do
            [ -e "$f" ] || continue
            echo "  $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -d crm -f "$f"
          done
